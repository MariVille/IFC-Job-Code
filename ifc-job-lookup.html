<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFC Job Lookup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }
  
  header { background: #1a1a2e; padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { color: #fff; font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
  header span { color: #a0aec0; font-size: 13px; }
  .logo { background: #e8b84b; color: #1a1a2e; font-weight: 800; font-size: 13px; padding: 6px 10px; border-radius: 6px; letter-spacing: 1px; }

  .search-bar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 16px 24px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .search-wrap { max-width: 700px; margin: 0 auto; position: relative; }
  .search-wrap input { width: 100%; padding: 12px 16px 12px 44px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.2s; background: #f8fafc; }
  .search-wrap input:focus { border-color: #e8b84b; background: #fff; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #a0aec0; font-size: 18px; }
  .search-hint { margin-top: 8px; font-size: 12px; color: #a0aec0; text-align: center; }

  .stats { max-width: 960px; margin: 16px auto 0; padding: 0 24px; display: flex; gap: 12px; flex-wrap: wrap; }
  .stat { background: #fff; border-radius: 8px; padding: 10px 16px; font-size: 12px; color: #718096; border: 1px solid #e2e8f0; }
  .stat strong { color: #1a1a2e; font-size: 16px; display: block; }

  .results { max-width: 960px; margin: 16px auto 32px; padding: 0 24px; }
  .result-count { font-size: 12px; color: #718096; margin-bottom: 10px; }

  .card { background: #fff; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 10px; overflow: hidden; transition: box-shadow 0.15s; }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .card-header { padding: 14px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .job-code { background: #1a1a2e; color: #e8b84b; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 6px; font-family: monospace; white-space: nowrap; }
  .job-name { font-weight: 600; font-size: 15px; flex: 1; }
  .client-name { font-size: 12px; color: #718096; }
  .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .active { background: #c6f6d5; color: #276749; }
  .complete { background: #e2e8f0; color: #4a5568; }
  .chevron { color: #a0aec0; font-size: 12px; transition: transform 0.2s; }
  .card.open .chevron { transform: rotate(180deg); }

  .card-body { display: none; padding: 0 18px 14px; border-top: 1px solid #f0f2f5; }
  .card.open .card-body { display: block; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
  .detail-item label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: #a0aec0; font-weight: 600; display: block; margin-bottom: 3px; }
  .detail-item .val { font-size: 13px; color: #2d3748; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tag { background: #f0f2f5; color: #4a5568; font-size: 11px; padding: 2px 8px; border-radius: 4px; }
  .tag.highlight { background: #fef9e7; color: #b7791f; border: 1px solid #f6e05e; }

  .issue-banner { background: #fff5f5; border: 1px solid #fed7d7; border-radius: 6px; padding: 6px 10px; margin-top: 8px; font-size: 12px; color: #c53030; }

  .empty { text-align: center; padding: 48px 24px; color: #a0aec0; }
  .empty .icon { font-size: 40px; margin-bottom: 12px; }

  .add-btn { position: fixed; bottom: 24px; right: 24px; background: #e8b84b; color: #1a1a2e; border: none; border-radius: 50px; padding: 12px 20px; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 16px rgba(232,184,75,0.4); display: flex; align-items: center; gap: 6px; }
  .add-btn:hover { background: #d4a43a; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
  .modal h2 { font-size: 16px; margin-bottom: 16px; }
  .modal input, .modal textarea { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; margin-bottom: 10px; font-family: inherit; outline: none; }
  .modal input:focus, .modal textarea:focus { border-color: #e8b84b; }
  .modal label { font-size: 12px; color: #718096; display: block; margin-bottom: 4px; font-weight: 600; }
  .modal-btns { display: flex; gap: 8px; margin-top: 8px; }
  .btn-save { background: #1a1a2e; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-weight: 600; cursor: pointer; flex: 1; }
  .btn-cancel { background: #f0f2f5; color: #4a5568; border: none; border-radius: 8px; padding: 10px 20px; font-weight: 600; cursor: pointer; }

  .updated { font-size: 11px; color: #a0aec0; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <div class="logo">IFC</div>
  <div>
    <h1>Job Lookup</h1>
    <span>Inline Flooring Concepts — Job Reference</span>
  </div>
</header>

<div class="search-bar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search by job code, address, supplier, PO number, client..." autocomplete="off">
    <div class="search-hint">Type anything — job code (3552), address (80 Collins), supplier, PO number, description</div>
  </div>
</div>

<div class="stats">
  <div class="stat"><strong id="totalCount">0</strong>Total Jobs</div>
  <div class="stat"><strong id="activeCount">0</strong>Active</div>
  <div class="stat"><strong id="completeCount">0</strong>Complete</div>
  <div class="stat"><strong id="clientCount">0</strong>Clients</div>
</div>

<div class="results">
  <div class="result-count" id="resultCount"></div>
  <div id="jobList"></div>
</div>

<button class="add-btn" onclick="openModal()">+ Add Job</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Add / Update Job</h2>
    <label>Job Code *</label>
    <input type="text" id="mCode" placeholder="e.g. 3661">
    <label>Job Name *</label>
    <input type="text" id="mName" placeholder="e.g. 10B 469 Latrobe St">
    <label>Client</label>
    <input type="text" id="mClient" placeholder="e.g. McCormack">
    <label>Status</label>
    <input type="text" id="mStatus" placeholder="Active or Complete">
    <label>Addresses / Site locations (comma separated)</label>
    <input type="text" id="mAddresses" placeholder="e.g. 469 Latrobe St, Melbourne">
    <label>Suppliers (comma separated)</label>
    <input type="text" id="mSuppliers" placeholder="e.g. Intafloors, Classic Architecture">
    <label>PO Numbers (comma separated)</label>
    <input type="text" id="mPos" placeholder="e.g. 603, 597, 598">
    <label>Invoice / Supplier Refs (comma separated)</label>
    <input type="text" id="mRefs" placeholder="e.g. INV-0561, TAX INVOICE 108979">
    <label>Issues / Notes</label>
    <textarea id="mIssues" rows="2" placeholder="e.g. Duplicate code — also exists as J1145"></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveJob()">Save Job</button>
    </div>
  </div>
</div>

// Load any locally added jobs from localStorage
function loadLocalJobs() {
  try {
    const saved = localStorage.getItem('ifc_extra_jobs');
    if (saved) {
      const extras = JSON.parse(saved);
      extras.forEach(extra => {
        const idx = jobsData.findIndex(j => j.number === extra.number);
        if (idx >= 0) jobsData[idx] = extra;
        else jobsData.push(extra);
      });
    }
  } catch(e) {}
}

function saveLocalJobs(newJob) {
  try {
    const saved = localStorage.getItem('ifc_extra_jobs');
    const extras = saved ? JSON.parse(saved) : [];
    const idx = extras.findIndex(j => j.number === newJob.number);
    if (idx >= 0) extras[idx] = newJob;
    else extras.push(newJob);
    localStorage.setItem('ifc_extra_jobs', JSON.stringify(extras));
  } catch(e) {}
}

// Stats
function updateStats(filtered) {
  document.getElementById('totalCount').textContent = jobsData.length;
  document.getElementById('activeCount').textContent = jobsData.filter(j => j.status === 'Active').length;
  document.getElementById('completeCount').textContent = jobsData.filter(j => j.status === 'Complete').length;
  const clients = new Set(jobsData.filter(j => j.client).map(j => j.client));
  document.getElementById('clientCount').textContent = clients.size;
}

function search(query) {
  if (!query) return jobsData;
  const q = query.toLowerCase();
  return jobsData.filter(j => {
    return (
      j.number.toLowerCase().includes(q) ||
      j.description.toLowerCase().includes(q) ||
      j.client.toLowerCase().includes(q) ||
      j.status.toLowerCase().includes(q) ||
      j.addresses.some(a => a.toLowerCase().includes(q)) ||
      j.suppliers.some(s => s.toLowerCase().includes(q)) ||
      j.refs.some(r => r.toLowerCase().includes(q)) ||
      j.pos.some(p => p.toLowerCase().includes(q)) ||
      (j.issues && j.issues.toLowerCase().includes(q))
    );
  });
}

function highlight(text, query) {
  if (!query || !text) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark style="background:#fef9e7;border-radius:2px;padding:0 1px">$1</mark>');
}

function renderJobs(jobs, query) {
  const container = document.getElementById('jobList');
  const countEl = document.getElementById('resultCount');

  if (jobs.length === 0) {
    container.innerHTML = `<div class="empty"><div class="icon">🔍</div><div>No jobs found for "${query}"</div><div style="font-size:12px;margin-top:8px">Try a different keyword, address, or PO number</div></div>`;
    countEl.textContent = '';
    return;
  }

  countEl.textContent = query ? `${jobs.length} result${jobs.length !== 1 ? 's' : ''} for "${query}"` : `Showing all ${jobs.length} jobs`;

  container.innerHTML = jobs.map((j, i) => {
    const q = query ? query.toLowerCase() : '';
    const matchedAddresses = q ? j.addresses.filter(a => a.toLowerCase().includes(q)) : j.addresses.slice(0,2);
    const matchedSuppliers = q ? j.suppliers.filter(s => s.toLowerCase().includes(q)) : j.suppliers.slice(0,3);
    const matchedPos = q ? j.pos.filter(p => p.toLowerCase().includes(q)) : j.pos.slice(0,5);
    const matchedRefs = q ? j.refs.filter(r => r.toLowerCase().includes(q)) : j.refs.slice(0,3);
    const allAddresses = q ? j.addresses : j.addresses.slice(0,4);
    const allSuppliers = q ? j.suppliers : j.suppliers.slice(0,5);
    const allPos = q ? j.pos : j.pos.slice(0,8);
    const allRefs = q ? j.refs : j.refs.slice(0,4);

    return `
    <div class="card" id="card-${i}">
      <div class="card-header" onclick="toggleCard(${i})">
        <span class="job-code">${highlight(j.number, query)}</span>
        <div style="flex:1;min-width:0">
          <div class="job-name">${highlight(j.description, query)}</div>
          <div class="client-name">${highlight(j.client || '—', query)}</div>
        </div>
        <span class="status-badge ${j.status === 'Active' ? 'active' : 'complete'}">${j.status}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="card-body">
        <div class="detail-grid">
          <div class="detail-item">
            <label>Job Code</label>
            <div class="val" style="font-weight:700;font-size:15px;font-family:monospace">${j.number}</div>
          </div>
          <div class="detail-item">
            <label>Client / Builder</label>
            <div class="val">${j.client || '—'}</div>
          </div>
          <div class="detail-item">
            <label>Status</label>
            <div class="val">${j.status}</div>
          </div>
          <div class="detail-item" style="grid-column:1/-1">
            <label>Site Addresses</label>
            <div class="tags">${allAddresses.map(a => `<span class="tag ${q && a.toLowerCase().includes(q) ? 'highlight' : ''}">${highlight(a,query)}</span>`).join('')}</div>
          </div>
          <div class="detail-item" style="grid-column:1/-1">
            <label>Suppliers</label>
            <div class="tags">${allSuppliers.map(s => `<span class="tag ${q && s.toLowerCase().includes(q) ? 'highlight' : ''}">${highlight(s,query)}</span>`).join('')}</div>
          </div>
          <div class="detail-item" style="grid-column:1/-1">
            <label>PO Numbers</label>
            <div class="tags">${allPos.map(p => `<span class="tag ${q && p.toLowerCase().includes(q) ? 'highlight' : ''}">${highlight(p,query)}</span>`).join('')}${j.pos.length > 8 && !q ? `<span class="tag">+${j.pos.length-8} more</span>` : ''}</div>
          </div>
          <div class="detail-item" style="grid-column:1/-1">
            <label>Invoice / Supplier Refs</label>
            <div class="tags">${allRefs.map(r => `<span class="tag ${q && r.toLowerCase().includes(q) ? 'highlight' : ''}">${highlight(r,query)}</span>`).join('')}</div>
          </div>
        </div>
        ${j.issues ? `<div class="issue-banner">⚠️ ${j.issues}</div>` : ''}
        <div style="text-align:right;margin-top:8px">
          <button onclick="editJob('${j.number}')" style="font-size:12px;color:#718096;background:none;border:none;cursor:pointer;text-decoration:underline">Edit this job</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(i) {
  const card = document.getElementById(`card-${i}`);
  card.classList.toggle('open');
}

let currentQuery = '';
document.getElementById('searchInput').addEventListener('input', function() {
  currentQuery = this.value.trim();
  const results = search(currentQuery);
  renderJobs(results, currentQuery);
});

function openModal(prefill) {
  document.getElementById('modalOverlay').classList.add('open');
  if (prefill) {
    document.getElementById('mCode').value = prefill.number || '';
    document.getElementById('mName').value = prefill.description || '';
    document.getElementById('mClient').value = prefill.client || '';
    document.getElementById('mStatus').value = prefill.status || '';
    document.getElementById('mAddresses').value = (prefill.addresses||[]).join(', ');
    document.getElementById('mSuppliers').value = (prefill.suppliers||[]).join(', ');
    document.getElementById('mPos').value = (prefill.pos||[]).join(', ');
    document.getElementById('mRefs').value = (prefill.refs||[]).join(', ');
    document.getElementById('mIssues').value = prefill.issues || '';
  } else {
    ['mCode','mName','mClient','mStatus','mAddresses','mSuppliers','mPos','mRefs','mIssues'].forEach(id => document.getElementById(id).value = '');
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function editJob(code) {
  const job = jobsData.find(j => j.number === code);
  if (job) openModal(job);
}

function saveJob() {
  const code = document.getElementById('mCode').value.trim();
  const name = document.getElementById('mName').value.trim();
  if (!code || !name) { alert('Job Code and Job Name are required.'); return; }
  const newJob = {
    number: code,
    description: name,
    client: document.getElementById('mClient').value.trim(),
    status: document.getElementById('mStatus').value.trim() || 'Active',
    addresses: document.getElementById('mAddresses').value.split(',').map(s=>s.trim()).filter(Boolean),
    suppliers: document.getElementById('mSuppliers').value.split(',').map(s=>s.trim()).filter(Boolean),
    pos: document.getElementById('mPos').value.split(',').map(s=>s.trim()).filter(Boolean),
    refs: document.getElementById('mRefs').value.split(',').map(s=>s.trim()).filter(Boolean),
    issues: document.getElementById('mIssues').value.trim(),
  };
  const idx = jobsData.findIndex(j => j.number === code);
  if (idx >= 0) jobsData[idx] = newJob;
  else jobsData.push(newJob);
  saveLocalJobs(newJob);
  closeModal();
  updateStats();
  const results = search(currentQuery);
  renderJobs(results, currentQuery);
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Init
loadLocalJobs();
updateStats();
renderJobs(jobsData, '');
</script>
