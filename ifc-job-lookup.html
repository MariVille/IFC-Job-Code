<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  header { background: #1a1a2e; color: white; padding: 20px 24px; }
  header h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.3px; }
  header p { font-size: 0.8rem; color: #8899aa; margin-top: 4px; }
  
  .search-bar { background: white; padding: 16px 24px; border-bottom: 1px solid #e0e4ea; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .search-bar input { width: 100%; padding: 10px 16px; border: 1.5px solid #d0d5dd; border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
  .search-bar input:focus { border-color: #1a1a2e; }
  .search-bar .meta { font-size: 0.78rem; color: #888; margin-top: 8px; }
  
  .filter-bar { background: white; padding: 8px 24px 12px; border-bottom: 1px solid #e0e4ea; display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn { padding: 4px 12px; border-radius: 20px; border: 1.5px solid #d0d5dd; background: white; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; color: #444; }
  .filter-btn.active { background: #1a1a2e; color: white; border-color: #1a1a2e; }
  .filter-btn:hover:not(.active) { border-color: #1a1a2e; color: #1a1a2e; }
  
  .results { padding: 16px 24px; max-width: 1100px; margin: 0 auto; }
  
  .job-card { background: white; border-radius: 10px; padding: 16px 20px; margin-bottom: 10px; border: 1px solid #e0e4ea; transition: box-shadow 0.15s; }
  .job-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  
  .card-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .job-code { background: #1a1a2e; color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; font-family: monospace; white-space: nowrap; flex-shrink: 0; }
  .job-name { font-size: 1rem; font-weight: 600; color: #1a1a2e; }
  .job-client { font-size: 0.82rem; color: #666; margin-top: 2px; }
  
  .status-badge { margin-left: auto; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; flex-shrink: 0; }
  .status-Active { background: #e6f7ee; color: #1a7a45; }
  .status-Complete { background: #f0f0f0; color: #666; }
  
  .card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.82rem; }
  .card-field label { color: #888; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px; }
  .card-field span { color: #333; }
  
  .notes-flag { margin-top: 10px; padding: 8px 12px; background: #fff8e6; border-left: 3px solid #f59e0b; border-radius: 0 6px 6px 0; font-size: 0.8rem; color: #92400e; }
  .notes-hold { background: #fff0f0; border-left-color: #ef4444; color: #991b1b; }
  
  .no-results { text-align: center; padding: 48px 24px; color: #888; }
  .no-results h3 { font-size: 1.1rem; margin-bottom: 8px; }
  
  @media (max-width: 600px) { .card-body { grid-template-columns: 1fr; } }
</style>

let currentFilter = 'all';

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  search();
}

function search() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let filtered = JOBS;
  
  // Apply status/type filter
  if (currentFilter === 'Active') filtered = filtered.filter(j => j.status === 'Active');
  else if (currentFilter === 'Complete') filtered = filtered.filter(j => j.status === 'Complete');
  else if (currentFilter === 'hold') filtered = filtered.filter(j => j.notes.toLowerCase().includes('hold'));
  else if (currentFilter === 'mccormack') filtered = filtered.filter(j => j.client.toLowerCase().includes('mccormack'));
  else if (currentFilter === 'capabuild') filtered = filtered.filter(j => j.client.toLowerCase().includes('capabuild'));
  else if (currentFilter === 'insite') filtered = filtered.filter(j => j.client.toLowerCase().includes('insite'));
  
  // Apply text search
  if (q) {
    filtered = filtered.filter(j => 
      j.code.toLowerCase().includes(q) ||
      j.name.toLowerCase().includes(q) ||
      j.client.toLowerCase().includes(q) ||
      j.address.toLowerCase().includes(q) ||
      j.suppliers.toLowerCase().includes(q) ||
      j.pos.toLowerCase().includes(q) ||
      j.notes.toLowerCase().includes(q)
    );
  }
  
  const container = document.getElementById('results');
  const count = document.getElementById('resultCount');
  count.textContent = filtered.length + ' job' + (filtered.length !== 1 ? 's' : '') + ' found';
  
  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-results"><h3>No jobs found</h3><p>Try a different search term</p></div>';
    return;
  }
  
  container.innerHTML = filtered.map(j => {
    const isHold = j.notes.toLowerCase().includes('hold');
    const hasNotes = j.notes && j.notes.trim();
    const noteClass = isHold ? 'notes-hold' : 'notes-flag';
    const notesHtml = hasNotes ? `<div class="${noteClass}">${escHtml(j.notes)}</div>` : '';
    
    return `<div class="job-card">
      <div class="card-header">
        <span class="job-code">${escHtml(j.code)}</span>
        <div>
          <div class="job-name">${escHtml(j.name)}</div>
          <div class="job-client">${escHtml(j.client)}</div>
        </div>
        <span class="status-badge status-${j.status}">${j.status}</span>
      </div>
      <div class="card-body">
        ${j.address ? `<div class="card-field"><label>Site Address</label><span>${escHtml(j.address)}</span></div>` : ''}
        ${j.pos ? `<div class="card-field"><label>PO Numbers</label><span>${escHtml(j.pos)}</span></div>` : ''}
        ${j.suppliers ? `<div class="card-field" style="grid-column:1/-1"><label>Known Suppliers</label><span>${escHtml(j.suppliers)}</span></div>` : ''}
      </div>
      ${notesHtml}
    </div>`;
  }).join('');
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Initial render
search();
